<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales BI Assistant</title><link rel="stylesheet" href="/static/style.css"></head><body><main><p class="tag">RSG · MINI BUSINESS INTELLIGENCE</p><h1>Sales BI Assistant</h1><p>Ask questions about your sales data in plain English.</p><section><label for="q">Your question</label><textarea id="q" placeholder="What is the total revenue?"></textarea><button id="go">Ask Assistant</button><div class="examples"><button>What is the total revenue?</button><button>Which product generated the highest revenue?</button><button>Show monthly revenue trend</button><button>Which region generated the highest sales?</button><button>Compare revenue between January and February</button></div></section><section id="out" hidden><h2>Answer</h2><p id="answer"></p><h3>Supporting figures</h3><div id="table"></div></section><p id="status"></p></main><script>
const q=document.querySelector('#q'),out=document.querySelector('#out'),status=document.querySelector('#status');
async function ask(){if(!q.value.trim()){status.textContent='Enter a question.';return;}status.textContent='Working...';out.hidden=true;try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#answer').textContent=d.answer;let rows=d.supporting_data||[],w=document.querySelector('#table');w.replaceChildren();if(rows.length){let t=document.createElement('table'),cols=Object.keys(rows[0]),h=document.createElement('tr');cols.forEach(c=>{let th=document.createElement('th');th.textContent=c;h.append(th)});t.append(h);rows.forEach(row=>{let tr=document.createElement('tr');cols.forEach(c=>{let td=document.createElement('td');td.textContent=row[c]??'';tr.append(td)});t.append(tr)});w.append(t)}out.hidden=false;status.textContent='Done.'}catch(e){status.textContent=e.message}}
document.querySelector('#go').onclick=ask;document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{q.value=b.textContent;ask()});
</script></body></html>
